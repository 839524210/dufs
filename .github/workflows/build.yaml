name: Build Binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dufs-latest-release
  cancel-in-progress: false

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Android ARM64, minimum API 24
          - target: aarch64-linux-android
            android: true
            use-cross: false

          # Linux ARM64 musl
          - target: aarch64-unknown-linux-musl
            android: false
            use-cross: true

          # Linux ARMv7 hard-float musl
          - target: armv7-unknown-linux-musleabihf
            android: false
            use-cross: true

          # Linux ARM hard-float musl
          - target: arm-unknown-linux-musleabihf
            android: false
            use-cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Android NDK
        if: matrix.android
        shell: bash
        run: |
          set -euxo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager not found under $SDK/cmdline-tools"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure Android ARM64
        if: matrix.android
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          # API 24 provides getifaddrs/freeifaddrs on Android.
          CLANG="$TOOLCHAIN/aarch64-linux-android24-clang"
          AR="$TOOLCHAIN/llvm-ar"

          test -x "$CLANG"
          test -x "$AR"

          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG" >> "$GITHUB_ENV"

          echo "CC_aarch64_linux_android=$CLANG" >> "$GITHUB_ENV"
          echo "CC_aarch64-linux-android=$CLANG" >> "$GITHUB_ENV"

          echo "AR_aarch64_linux_android=$AR" >> "$GITHUB_ENV"
          echo "AR_aarch64-linux-android=$AR" >> "$GITHUB_ENV"

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build Binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.use-cross }}
        run: |
          set -euxo pipefail

          if [[ "$USE_CROSS" == "true" ]]; then
            cross build --locked --release --target "$TARGET"
          else
            cargo build --locked --release --target "$TARGET"
          fi

          test -f "target/$TARGET/release/dufs"

      - name: Package Archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euxo pipefail

          DIST="$RUNNER_TEMP/dist"
          NAME="dufs-${TARGET}"
          DIR="$DIST/$NAME"

          mkdir -p "$DIR"
          cp "target/$TARGET/release/dufs" "$DIR/"

          tar -czf "$DIST/$NAME.tar.gz" -C "$DIST" "$NAME"

      - name: Upload Build
        uses: actions/upload-artifact@v5
        with:
          name: dufs-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish Latest Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download All Binaries
        uses: actions/download-artifact@v5
        with:
          pattern: dufs-*
          path: dist
          merge-multiple: true

      - name: Update Latest Tag
        shell: bash
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build
          target_commitish: ${{ github.sha }}
          body: |
            Automated binaries built from the latest main branch.

            Assets are updated automatically after each successful build.
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
