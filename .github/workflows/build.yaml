name: Build Binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dufs-latest-release
  cancel-in-progress: false

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Android ARM64
          - target: aarch64-linux-android
            android: true
            use-cross: false

          # Android ARMv7
          - target: armv7-linux-androideabi
            android: true
            use-cross: false

          # Linux ARM64 musl
          - target: aarch64-unknown-linux-musl
            android: false
            use-cross: true

          # Linux ARMv7 musl
          - target: armv7-unknown-linux-musleabihf
            android: false
            use-cross: true

          # Linux ARM musl
          - target: arm-unknown-linux-musleabihf
            android: false
            use-cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Android NDK
        if: matrix.android
        shell: bash
        run: |
          set -euxo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "Cannot find sdkmanager in $SDK/cmdline-tools"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure Android Linker
        if: matrix.android
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euxo pipefail

          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          if [[ "$TARGET" == "aarch64-linux-android" ]]; then
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          elif [[ "$TARGET" == "armv7-linux-androideabi" ]]; then
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$TOOLCHAIN/armv7a-linux-androideabi21-clang" >> "$GITHUB_ENV"
          fi

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build Binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.use-cross }}
        run: |
          set -euxo pipefail

          if [[ "$USE_CROSS" == "true" ]]; then
            cross build --locked --release --target "$TARGET"
          else
            cargo build --locked --release --target "$TARGET"
          fi

      - name: Package Archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euxo pipefail

          BIN="dufs"
          VERSION="dev-${GITHUB_SHA::7}"
          NAME="${BIN}-${VERSION}-${TARGET}"
          DIST="$RUNNER_TEMP/dist"
          DIR="$DIST/$NAME"

          mkdir -p "$DIR"
          cp "target/$TARGET/release/$BIN" "$DIR/"

          tar -czf "$DIST/$NAME.tar.gz" -C "$DIST" "$NAME"

      - name: Upload Build
        uses: actions/upload-artifact@v5
        with:
          name: dufs-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish Latest Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download All Binaries
        uses: actions/download-artifact@v5
        with:
          pattern: dufs-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Automated binaries built from the latest main branch.

            Updated automatically on every push to main.
          prerelease: false
          make_latest: true
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
